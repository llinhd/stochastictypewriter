<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typing Space — Stochastic Typewriter</title><link rel="stylesheet" href="style.css">
</head><body class="app-page-typing standalone-page">
<main>
  <section id="typing-page" class="app-page">
    <div class="typing-topbar">
      <a class="room-button page-home-link" href="index.html">← BACK TO HOME</a>
      <aside class="typing-sidebar"><div class="folder-list">
      <button data-book="1" class="folder" type="button"><span class="circle"></span><span class="circle-2"></span><span class="title">a diary without "a"</span></button>
      <button data-book="2" class="folder" type="button"><span class="circle"></span><span class="circle-2"></span><span class="title">things make you stutter</span></button>
      <button data-book="3" class="folder" type="button"><span class="circle"></span><span class="circle-2"></span><span class="title">dream loop</span></button>
      <button data-book="4" class="folder" type="button"><span class="circle"></span><span class="circle-2"></span><span class="title">questions</span></button>
      <button data-book="5" class="folder" type="button"><span class="circle"></span><span class="circle-2"></span><span class="title">All is all</span></button>
      <button data-book="6" class="folder" type="button"><span class="circle"></span><span class="circle-2"></span><span class="title">fließtext</span></button>
      </div></aside>
      <p id="folder-description" class="folder-description">Choose a folder to discover the writing rule it brings into the page.</p>
    </div>
    <a id="move-to-reading" class="room-button" href="reading-room.html">reading room →</a>
    <div class="typing-workspace"><div class="typing-paper"><div class="TextInput"><div id="editable-text-layer" contenteditable="true" data-placeholder="choose a folder to write"></div></div></div></div>
  </section>
</main>
<script src="typing-space.js"></script>
</body></html>
