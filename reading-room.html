<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Room — Stochastic Typewriter</title>
  <script src="p5.js"></script><script src="p5.sound.min.js"></script><link rel="stylesheet" href="style.css">
</head><body class="app-page-reading standalone-page">
<main><section id="reading-page" class="app-page" aria-label="Reading Room">
  <div class="reading-topbar"><a class="room-button page-home-link" href="typing-space.html">← typing space</a>
  <aside class="reading-sidebar">
    <div class="folder-list reading-folder-list">
      <button data-book="1" class="folder" type="button"><span class="circle"></span><span class="circle-2"></span><span class="title">a diary without "a"</span></button>
      <button data-book="2" class="folder" type="button"><span class="circle"></span><span class="circle-2"></span><span class="title">things make you stutter</span></button>
      <button data-book="3" class="folder" type="button"><span class="circle"></span><span class="circle-2"></span><span class="title">dream loop</span></button>
      <button data-book="4" class="folder" type="button"><span class="circle"></span><span class="circle-2"></span><span class="title">questions</span></button>
      <button data-book="5" class="folder" type="button"><span class="circle"></span><span class="circle-2"></span><span class="title">All is all</span></button>
      <button data-book="6" class="folder" type="button"><span class="circle"></span><span class="circle-2"></span><span class="title">fließtext</span></button>
    </div>
  </aside></div>
  <div class="reading-content"><aside class="reading-controls"><div class="container"><div class="control-group"><div class="controls-panel">
      <div id="slider-control">
        <section class="panel-box sound-box"><div class="low-value"><label class="group-toggle"><span class="group-toggle-title">bass <output id="bass-value" class="live-value">0</output></span><input type="checkbox" id="low-group-switch" checked><span class="toggle-options"><span class="toggle-label off-label">off</span><span class="toggle-label on-label">on</span></span></label><div class="variable-slider"><p>thunder</p><div class="slider-range"><div class="slider-track"></div><input id="variable-start" type="range" value="50" min="0" max="255"><input id="variable-end" type="range" value="255" min="0" max="255"></div><label class="effect-toggle"><input type="checkbox" id="weight-switch" checked><span></span></label></div><div class="opacity-slider"><p>rain</p><div class="slider-range"><div class="slider-track"></div><input id="opa-start" type="range" value="0" min="0" max="255"><input id="opa-end" type="range" value="255" min="0" max="255"></div><label class="effect-toggle"><input type="checkbox" id="opacity-switch"><span></span></label></div></div></section>
        <section class="panel-box sound-box"><div class="mid-value"><label class="group-toggle"><span class="group-toggle-title">voices <output id="voices-value" class="live-value">0</output></span><input type="checkbox" id="mid-group-switch" checked><span class="toggle-options"><span class="toggle-label off-label">off</span><span class="toggle-label on-label">on</span></span></label><div class="size-slider"><p>chaos</p><div class="slider-range"><div class="slider-track"></div><input id="size-start" type="range" value="0" min="0" max="255"><input id="size-end" type="range" value="255" min="0" max="255"></div><label class="effect-toggle"><input type="checkbox" id="size-switch" checked><span></span></label></div><div class="elavate-slider"><p>jump</p><div class="slider-range"><div class="slider-track"></div><input id="elavate-start" type="range" value="0" min="0" max="255"><input id="elavate-end" type="range" value="255" min="0" max="255"></div><label class="effect-toggle"><input type="checkbox" id="elavate-switch"><span></span></label></div></div></section>
        <section class="panel-box sound-box"><div class="treble-value"><label class="group-toggle"><span class="group-toggle-title">treble <output id="treble-value" class="live-value">0</output></span><input type="checkbox" id="treble-group-switch" checked><span class="toggle-options"><span class="toggle-label off-label">off</span><span class="toggle-label on-label">on</span></span></label><div class="rotate-slider"><p>wind</p><div class="slider-range"><div class="slider-track"></div><input id="rotate-start" type="range" value="80" min="0" max="255"><input id="rotate-end" type="range" value="255" min="0" max="255"></div><label class="effect-toggle"><input type="checkbox" id="rotate-switch" checked><span></span></label></div><div class="spacing-slider"><p>distance</p><div class="slider-range"><div class="slider-track"></div><input id="spacing-start" type="range" value="0" min="0" max="255"><input id="spacing-end" type="range" value="100" min="0" max="255"></div><label class="effect-toggle"><input type="checkbox" id="spacing-switch"><span></span></label></div></div></section>
      </div>
      <section class="panel-box setup-box"><div id="font-box"><label for="font-uploader">Upload your font</label><input type="file" id="font-uploader" accept=".ttf, .otf, .woff, .woff2"></div><div id="paper-box"><div class="paper-control"><p>paper color</p><div class="paper-color-options"><button class="paper-color-button is-active" data-paper-color="#f9f1f1" type="button"></button><button class="paper-color-button" data-paper-color="#f1f7f9" type="button"></button><button class="paper-color-button" data-paper-color="#ebf4f0" type="button"></button><button class="paper-color-button" data-paper-color="#f8f1f9" type="button"></button><button class="paper-color-button" data-paper-color="#fbf9e4" type="button"></button></div></div><div class="paper-control"><p>text position</p><div class="paper-align-options"><button class="paper-align-button is-active" data-text-position="top" type="button">top</button><button class="paper-align-button" data-text-position="middle" type="button">middle</button><button class="paper-align-button" data-text-position="bottom" type="button">bottom</button></div></div><div class="paper-control"><p>view</p><div class="view-mode-options"><button class="view-mode-button is-active" data-view-mode="print" type="button">print</button><button class="view-mode-button" data-view-mode="digital" type="button">digital</button></div></div></div></section>
      <section class="panel-box export-box"><div id="export-box"><button id="export-image" type="button">export image</button><button id="export-pdf" type="button">export pdf</button><button id="record-video" type="button">record video</button><p id="record-status"></p></div></section>
    </div></div></div></aside><div id="canvas-holder"></div></div>
  <a class="room-button reading-home-link" href="index.html">← homepage</a>
  <div class="visually-hidden"><div class="TextInput"><div id="locked-text-layer"></div><div id="editable-text-layer" contenteditable="true"></div></div><button id="save-line"></button><button id="prev-page"></button><span id="page-indicator"></span><button id="next-page"></button></div>
</section></main>
<aside id="website-metadata">
  <p class="metadata-title">Your current surroundings:</p>
  <p id="metadata-time"></p>
  <p id="metadata-location"></p></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/0.6.5/opentype.min.js" crossorigin="anonymous"></script><script src="sketch.js?v=separate-pages"></script>
</body></html>
